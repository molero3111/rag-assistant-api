services:
  api-rag-assistant:
    build:
      context: ./
      dockerfile: Dockerfile
    image: rag-assistant-api-image
    container_name: api-rag-assistant
    restart: always
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      - db-rag-assistant
      - redis-rag-assistant
    networks:
      - rag-assistant-network
    command: ["./wait-for-it.sh", "db:5432", "--", "./start_api.sh"]

  db-rag-assistant:
    image: postgres:15
    container_name: db-rag-assistant
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: tutor_db
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_pass
    networks:
      - rag-assistant-network

  redis-rag-assistant:
    image: "redis:latest"
    container_name: redis-rag-assistant
    restart: always
    networks:
      - rag-assistant-network

volumes:
  postgres_data:

networks:
  rag-assistant-network:
    driver: bridge
